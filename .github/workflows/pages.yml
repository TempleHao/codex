name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      include_notes:
        description: "Also sync highlights and thoughts (up to 80 notebook books)"
        type: boolean
        default: false
      reset_history:
        description: "Rebuild cloud reading history after losing the passphrase; browser records stay intact"
        type: boolean
        default: false
  schedule:
    - cron: "17 1,13 * * *"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build static application
        run: npm run build:preview
        env:
          LIFE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Sync and encrypt WeRead data
        id: weread
        run: node scripts/run-weread-sync.mjs
        env:
          WEREAD_API_KEY: ${{ secrets.WEREAD_API_KEY }}
          WEREAD_SYNC_PASSPHRASE: ${{ secrets.WEREAD_SYNC_PASSPHRASE }}
          WEREAD_SYNC_INCLUDE_NOTES: ${{ inputs.include_notes || false }}
          WEREAD_SYNC_RESET_HISTORY: ${{ inputs.reset_history || false }}
          LIFE_SYNC_OUTPUT_DIR: preview-out
          LIFE_SYNC_PREVIOUS_URL: https://templehao.github.io/codex/weread-sync.json
      - name: Check export
        run: test -f preview-out/index.html
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: preview-out
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
